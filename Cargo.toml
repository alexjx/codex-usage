[package]
name = "agent-usage"
version = "0.1.0"
edition = "2021"
description = "Local Codex and Claude Code usage reports and live monitoring"
license = "MIT"
repository = "https://github.com/alexjx/codex-usage"
readme = "README.md"
default-run = "agent-usage"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ctrlc = "3"
csv = "1"
directories = "6"
iana-time-zone = "0.1"
rust_decimal = { version = "1", features = ["serde-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
unicode-width = "0.2"
walkdir = "2"
zstd = "0.13"
blake3 = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
